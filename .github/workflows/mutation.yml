name: Mutation testing

# One full test run per mutant: too slow for every push, so weekly and on demand.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  stryker:
    runs-on: ubuntu-latest
    env:
      BULKDIKE_SAMPLES: '25'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt core/stryker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: core/target/stryker4s-report/

  semantic-mutants:
    runs-on: ubuntu-latest
    env:
      BULKDIKE_SAMPLES: '25'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: python3 mutation/semantic-mutants.py

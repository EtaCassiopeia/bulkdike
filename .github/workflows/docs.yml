name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # Snippets are included from the examples, so compile them before publishing them
      - name: Compile the examples and build the API reference
        run: sbt "examples/compile; core/doc"
      - name: Build the site
        run: |
          mkdocs build
          api="$(dirname "$(find target -path '*/bulkdike/api/index.html' | head -n 1)")"
          test -d "$api" || { echo "Scaladoc output not found" >&2; exit 1; }
          cp -R "$api" site/api
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

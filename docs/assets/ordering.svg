<text x="28" y="88" class="tiny" text-anchor="start">KEY</text><text x="262" y="88" class="tiny" text-anchor="start">LANE · KEPT IN RANK ORDER</text><text x="844" y="88" class="tiny" text-anchor="middle">STORE</text><text x="912" y="88" class="tiny" text-anchor="start">STORE LOG</text><rect x="814" y="120" width="60" height="150" rx="10" fill="url(#panel)" stroke="#334155"/><text x="844" y="199" class="tiny" text-anchor="middle">write</text><rect x="898" y="120" width="234" height="150" rx="10" fill="#070b16" stroke="#1e293b"/><text x="28" y="192" class="key" text-anchor="start">key = b</text><text x="28" y="211" class="mode" text-anchor="start" fill="#e879f9">chips show each input's day</text><path d="M270 179 h-8 v34 h8 M378 179 h8 v34 h-8" class="bracket"/><text x="324.0" y="228" class="tiny" text-anchor="middle">front →</text><line x1="400" y1="196" x2="814" y2="196" class="rail"/><line x1="400" y1="196" x2="814" y2="196" class="flow" stroke="#e879f9"/><g style="animation:k1 10.6s ease-in-out infinite;"><rect x="400" y="181.0" width="122" height="30" rx="15.0" class="shuttle" stroke="#e879f9" filter="url(#glow)"/></g><circle cx="814" cy="196" r="12" fill="none" stroke="#e879f9" stroke-width="2" class="pulse" style="animation:k2 10.6s linear infinite;"/><circle cx="814" cy="196" r="12" fill="none" stroke="#e879f9" stroke-width="2" class="pulse" style="animation:k3 10.6s linear infinite;"/><circle cx="814" cy="196" r="12" fill="none" stroke="#e879f9" stroke-width="2" class="pulse" style="animation:k4 10.6s linear infinite;"/><g style="animation:k5 10.6s ease-in-out infinite;"><rect x="-10.0" y="-10" width="20" height="20" rx="4" fill="#e879f9" fill-opacity="0.18" stroke="#e879f9" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#e879f9">5</text></g><g style="animation:k6 10.6s ease-in-out infinite;"><rect x="-10.0" y="-10" width="20" height="20" rx="4" fill="#e879f9" fill-opacity="0.18" stroke="#e879f9" stroke-width
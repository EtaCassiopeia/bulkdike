\* Nodes append their whole batch without leaving out what is already applied. Expected: AtMostOnce is violated (a
\* retry after a lost answer appends the command again, and the fence cannot tell).
CONSTANTS
  Commands = {c1, c2}
  Nodes = {n1, n2}
  MaxCrashes = 1
  MaxLost = 1
  Fenced = TRUE
  Deduplicated = FALSE

SPECIFICATION Spec
CONSTRAINT LogBound
INVARIANTS TypeOK Safety

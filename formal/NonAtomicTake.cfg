\* Taking entries off the queue and recording them as owned are separate, interruptible steps (the
\* `.uninterruptible` around takeUpTo + record removed). Expected: NoneStrandedAfterClose is violated
\* (a worker interrupted between the two steps loses the entries, and their callers wait forever).
CONSTANTS
  Callers = {c1, c2}
  Workers = {w1}
  MaxBatch = 2
  MaxQueue = 2
  SerialisedAdmission = TRUE
  CleanupOnInterrupt = TRUE
  AtomicTake = FALSE

SPECIFICATION Spec
INVARIANTS TypeOK Safety

\* The store appends without checking the log length. Expected: Safety is violated (two nodes append on top of the
\* same log they read, so a command is applied twice or answered with another command's position).
CONSTANTS
  Commands = {c1, c2}
  Nodes = {n1, n2}
  MaxCrashes = 1
  MaxLost = 1
  Fenced = FALSE
  Deduplicated = TRUE

SPECIFICATION Spec
CONSTRAINT LogBound
INVARIANTS TypeOK Safety

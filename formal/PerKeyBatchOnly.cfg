\* The per-key protocol with a positive maxBatchDelay: every input is batched by a worker. Expected: no error.
CONSTANTS
  Callers = {c1, c2, c3}
  Keys = {k1, k2}
  Workers = {w1, w2}
  MaxBatch = 2
  MaxQueue = 3
  BusyGuard = TRUE
  AtomicTake = TRUE
  AtomicAdmission = TRUE
  Direct = FALSE
  DirectGuard = TRUE
  AwaitCall = TRUE
  Sorted = TRUE
  LowRank = {c2}

SPECIFICATION Spec
INVARIANTS TypeOK Safety
PROPERTIES EveryCallerAnswered EveryDirectCallerDone
